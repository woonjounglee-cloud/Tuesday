<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuesday - Portfolio Manager</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Tuesday</h1>
            <p>Portfolio Management System</p>
        </header>

        <nav class="tabs">
            <button class="tab-button active" data-tab="roi">📈 ROI</button>
            <button class="tab-button" data-tab="balance">💰 Balance</button>
            <button class="tab-button" data-tab="portfolio">🎯 Portfolio</button>
        </nav>

        <!-- ROI Tab -->
        <div id="roi-tab" class="tab-content active">
            <div class="section-header">
                <h2>ROI (Return on Investment)</h2>
                <div class="button-group">
                    <button onclick="addRow('roi')">➕ 행 추가</button>
                    <button onclick="saveData()">💾 저장</button>
                    <button onclick="loadData()">🔄 새로고침</button>
                </div>
            </div>

            <div class="table-wrapper">
                <table id="roi-table">
                    <thead>
                        <tr>
                            <th>종목코드</th>
                            <th>종목명</th>
                            <th>초기투자금</th>
                            <th>수량</th>
                            <th>종가</th>
                            <th>평가금</th>
                            <th>수익률</th>
                            <th>삭제</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                    <tfoot>
                        <tr class="summary">
                            <td colspan="2">합계</td>
                            <td id="total-initial">0</td>
                            <td></td>
                            <td></td>
                            <td id="total-eval">0</td>
                            <td id="total-roi">0%</td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <!-- Balance Tab -->
        <div id="balance-tab" class="tab-content">
            <div class="section-header">
                <h2>Balance (잔고 현황)</h2>
                <div class="button-group">
                    <button onclick="addRow('balance')">➕ 행 추가</button>
                    <button onclick="saveData()">💾 저장</button>
                </div>
            </div>

            <div class="table-wrapper">
                <table id="balance-table">
                    <thead>
                        <tr>
                            <th>연도</th>
                            <th>월</th>
                            <th>투자원금</th>
                            <th>추가납입</th>
                            <th>잔고</th>
                            <th>수익률</th>
                            <th>기타</th>
                            <th>삭제</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- Portfolio Tab -->
        <div id="portfolio-tab" class="tab-content">
            <div class="section-header">
                <h2>Portfolio (포트폴리오)</h2>
                <div class="button-group">
                    <button onclick="performRebalancing()">🔄 Rebalancing</button>
                    <button onclick="addRow('portfolio')">➕ 행 추가</button>
                    <button onclick="saveData()">💾 저장</button>
                </div>
            </div>

            <div class="table-wrapper">
                <table id="portfolio-table">
                    <thead>
                        <tr>
                            <th>종목코드</th>
                            <th>종목명</th>
                            <th>자산군</th>
                            <th>구분</th>
                            <th>세팅비중(%)</th>
                            <th>현재비중(%)</th>
                            <th>빨강매수</th>
                            <th>삭제</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                    <tfoot>
                        <tr class="summary">
                            <td colspan="4">합계</td>
                            <td id="total-setting">0%</td>
                            <td id="total-current">0%</td>
                            <td></td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <footer>
            <p>Tuesday Portfolio Manager v1.0 | Python Standard Library Only</p>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
